name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build release zip
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          ZIP="orquestador-sx-v${VERSION}.zip"
          mkdir -p /tmp/release-staging
          rsync -a --exclude='.git' \
            --exclude='tooling/bench/worktrees' \
            --exclude='tooling/bench/results' \
            --exclude='.lab' \
            --exclude='*.zip' \
            ./ /tmp/release-staging/orquestador-sx/
          (cd /tmp/release-staging && zip -r "$GITHUB_WORKSPACE/$ZIP" orquestador-sx)
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Generate SHA256SUMS
        run: |
          sha256sum "$ZIP" | awk '{print $1 "  " $2}' > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "$ZIP" SHA256SUMS \
            --title "${{ github.ref_name }}" \
            --generate-notes
