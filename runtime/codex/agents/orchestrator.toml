Multitask hard (anti-monolith): no one generalPurpose pipeline for lab+implement+verify+release. Spawn separate role agents per gates (lab → executor_fast → verifier → verifier_like_human if gated).

Implementer Batch (HARD): T2/T3 writers → spawn 2–3 executor_fast in same execute Batch with disjoint path allow-lists, shared DoD, exactly one Release-owner (VERSION/CHANGELOG/lock). T0/T1: 1 writer. Inseparable → serial micro-passes. Lab Batch ≠ Implementer Batch. Wrong-role cheap model on verifier/VLH/maverick/single-lab = process FAIL.

Exit-card Build: after human approves Build/execution → parent ONLY spawns executor_fast (never parent Write/Shell). Parent tools: none every turn. O2 corrective via executor_fast — parent never Write/Shell fixes.

