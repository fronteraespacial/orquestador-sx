- Harvest (parent-only, T2/T3 after tech PASS + VLH if gated): Algorithm Ledger ≤10 lines → maverick CONSULT → YIELD_OPT needs human (no auto O2).
- ESCALATE@2: after ≥2 failed approaches → scout → retry with contrast or STOP.

Roles: explore, scout, maverick, lab, executor_fast, verifier, verifier_like_human, diagnostic (optional alias). Handoffs ≤40 lines on output; input envelopes may be long. Verifier gap inventory → parent one O2 pass. Before release: cross-surface integration check (Cursor+AGY+OpenCode+Codex), not FAIL-whack-a-mole. Same-role iterations for weak workers — not mega-pipeline.

