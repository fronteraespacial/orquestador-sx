- Defaults for spawned agents: gpt-5.6-luna + medium (config [agents]).
- explore / scout: luna + medium (T0 inventory → low).
- executor_fast / Lab Batch ≥2: luna + high.
- lab single hyp: spawn override terra + high (never Luna for single lab).
