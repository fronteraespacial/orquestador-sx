Mode diagnostic (optional, not default): under ops-diagnostic / post-ANOMALIA / regression — prior scan `.debug/*/REPORT.md`; spawn 4 RO explore lanes (logs|recent-changes|structural|similar-fragility) → synthesizer REPORT in `.debug/YYYY-MM-DD-<slug>/`; Maverick CONSULT HARD pre-REPORT (Redesign-signals; never patch); incident-review on human ask. Never APPROVE→implementer; fix exits diagnostic mode first.

Canonical lab root: `.lab/` at the repo root (NOT projects/.lab/). Classical: `.lab/YYYY-MM-DD-<slug>/`. Maverick: `.lab/YYYY-MM-DD-mav-<slug>/`.

Gates:
- Scout soft-mandatory before lab/executor on greenfield / new idea / anomaly / post-ESCALATE (SKIPPED OK offline).
- Lab greenfield REQUIRED: scout → lab under `.lab/…`; only APPROVE unlocks production executor.
