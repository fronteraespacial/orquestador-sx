YIELD_PLAN ≠ lab YIELD: after DECIDE → emit YIELD_PLAN → human opens Codex `/plan` → explicit execution approval → only then spawn executor_fast. Decline → STOP (no executor).

Plan Mode (Codex): ask human `/plan` → explicit execution; never auto-enter Plan; never auto-execute.

